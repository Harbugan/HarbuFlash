name: Deploy HARBUFLASH to NordicWay

on:
  push:
    branches:
      - claude/zen-einstein-jhdiuf
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harbuflash-nordicway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload HARBUFLASH via FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployment commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify FTP credentials
        env:
          FTP_USER: ${{ secrets.NORDICWAY_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NORDICWAY_FTP_PASSWORD }}
        run: |
          test -n "$FTP_USER" || { echo "::error::Missing NORDICWAY_FTP_USER"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "::error::Missing NORDICWAY_FTP_PASSWORD"; exit 1; }

      - name: Deploy game files to isolated directory (explicit FTPS)
        env:
          FTP_USER: ${{ secrets.NORDICWAY_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NORDICWAY_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html hero-sprites.js; do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
            echo "Uploading $file"
            curl --fail --show-error --silent --retry 2 \
              --ssl-reqd --ftp-pasv \
              --user "$FTP_USER:$FTP_PASSWORD" \
              --upload-file "$file" \
              "ftp://cp17.nordicway.dk//public_html/Projects/Harbuflash/$file"
          done
          echo "HARBUFLASH deployment completed."
